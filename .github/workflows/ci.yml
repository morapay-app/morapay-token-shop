name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          MORAPAY_API_BASE: https://api.morapay.io
          MORAPAY_MERCHANT_PUBLIC_KEY: pk_test_ci_placeholder
          MORAPAY_MERCHANT_SECRET_KEY: sk_test_ci_placeholder
          MORAPAY_ENV: test
          SHOP_ID: theafricanmeme
          NEXT_PUBLIC_SITE_URL: https://token-shop-production-ecd0135d.up.railway.app
          FORCE_FALLBACK: "true"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm build
        env:
          MORAPAY_API_BASE: https://api.morapay.io
          MORAPAY_MERCHANT_PUBLIC_KEY: pk_test_ci_placeholder
          MORAPAY_MERCHANT_SECRET_KEY: sk_test_ci_placeholder
          MORAPAY_ENV: test
          SHOP_ID: theafricanmeme
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          FORCE_FALLBACK: "true"
      - run: pnpm test:e2e
        env:
          MORAPAY_API_BASE: https://api.morapay.io
          MORAPAY_MERCHANT_PUBLIC_KEY: pk_test_ci_placeholder
          MORAPAY_MERCHANT_SECRET_KEY: sk_test_ci_placeholder
          MORAPAY_ENV: test
          SHOP_ID: theafricanmeme
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          FORCE_FALLBACK: "true"
