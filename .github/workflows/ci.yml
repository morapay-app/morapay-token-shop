name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MORAPAY_API_BASE: https://api.morapay.io
  MORAPAY_MERCHANT_PUBLIC_KEY: pk_test_ci_placeholder
  MORAPAY_MERCHANT_SECRET_KEY: sk_test_ci_placeholder
  MORAPAY_ENV: test
  SHOP_ID: theafricanmeme
  FORCE_FALLBACK: "true"

jobs:
  changes:
    name: paths
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            workspace:
              - 'app/**'
              - 'components/**'
              - 'config/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'public/**'
              - 'examples/**'
              - '*.ts'
              - '*.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.ts'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'shop.config.ts'
              - 'eslint.config.mjs'
              - 'postcss.config.mjs'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            lockfile:
              - 'pnpm-lock.yaml'

  quality:
    name: lint · typecheck · unit · build
    needs: changes
    if: >-
      needs.changes.outputs.workspace == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://token-shop-production-ecd0135d.up.railway.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-build
          retention-days: 1
          path: |
            .next
            public

  e2e:
    name: e2e
    needs: [changes, quality]
    if: >-
      needs.changes.outputs.workspace == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: next-build
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e

  audit:
    name: dependency audit
    needs: changes
    if: >-
      needs.changes.outputs.lockfile == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical